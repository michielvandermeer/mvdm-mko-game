services:
  postgres:
    image: postgres:18-alpine
    container_name: underclass-postgres
    environment:
      POSTGRES_DB: underclass
      POSTGRES_USER: underclass
      POSTGRES_PASSWORD: underclass
    ports:
      - "5432:5432"
    volumes:
      - underclass-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underclass -d underclass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  underclass-pgdata:
