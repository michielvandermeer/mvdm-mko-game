services:
  postgres:
    image: postgres:18-alpine
    container_name: underclass-postgres
    environment:
      POSTGRES_DB: underclass
      POSTGRES_USER: underclass
      POSTGRES_PASSWORD: underclass
    ports:
      # 5433 on the host: 5432 is commonly already taken by another local Postgres, and a port clash here
      # fails the whole compose up. The API's DbConnection points at 5433 to match.
      - "5433:5432"
    volumes:
      # Postgres 18 wants the mount one level up from the data directory; mounting /var/lib/postgresql/data
      # directly makes the image refuse to start.
      - underclass-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underclass -d underclass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  underclass-pgdata:
